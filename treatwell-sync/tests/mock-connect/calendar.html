<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Calendar (test copy)</title>
<style>body{font:14px system-ui;margin:20px}li{margin:4px 0}</style></head>
<body>
<h1>Pretend Connect calendar</h1>
<p><button id="prev">◀ Day</button> <strong id="day"></strong> <button id="next">Day ▶</button></p>
<ul id="list"></ul>
<script>
// Loads its data the way the real Connect calendar does: login cookie + X-Requested-With header.
let offset = 0;
const HEADERS = { Accept: 'application/json', 'X-Requested-With': 'XMLHttpRequest', 'X-Api-Version': '2' };
const iso = (o) => { const d = new Date(); d.setDate(d.getDate() + o); return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-'); };
function xhrJson(url) {
    return new Promise((resolve, reject) => {
        const x = new XMLHttpRequest();
        x.open('GET', url);
        Object.entries(HEADERS).forEach(([k, v]) => x.setRequestHeader(k, v));
        x.onload = () => (x.status === 200 ? resolve(JSON.parse(x.responseText)) : reject(x.status));
        x.onerror = reject;
        x.send();
    });
}
async function load() {
    const day = iso(offset);
    document.getElementById('day').textContent = day;
    const r = await fetch(`/api/venue/42/calendar.json?date-from=${day}&date-to=${day}&include=appointments,blocks&appointment-status-codes=CR,CN,NS,CP&utm_source=calendar-regular`,
        { headers: HEADERS, credentials: 'include' });
    const data = await r.json();
    document.getElementById('list').innerHTML = (data.appointments || []).map(a =>
        `<li>${a.startTime} ${a.employeeName} – ${a.offerName} (${a.appointmentStatusCode})</li>`).join('') || '<li>No bookings</li>';
}
(async () => {
    await xhrJson('/api/venue/42/employees.json?active=true&takes-appointments=true');
    fetch('/api/venue/42/activity/appointment-events.json?limit=100', { headers: HEADERS });
    fetch(`/api/calendar/venue/42/waiting-list-entry?date=${iso(0)}`, { headers: HEADERS });
    await load();
    document.getElementById('next').onclick = () => { offset++; load(); };
    document.getElementById('prev').onclick = () => { offset--; load(); };
})();
</script>
</body>
</html>
