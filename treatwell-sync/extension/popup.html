<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Today's bookings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
    <div>
        <h1>Today's bookings</h1>
        <p class="date" id="date"></p>
    </div>
    <div class="head__actions">
        <button class="icon" id="refresh" type="button" title="Refresh now" aria-label="Refresh now">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
        <button class="icon" id="open-tab" type="button" title="Open as a page" aria-label="Open as a page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </button>
        <button class="icon" id="settings" type="button" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        </button>
    </div>
</header>

<p class="status" id="status" role="status"></p>
<p class="status status--send" id="send-status" hidden></p>

<div class="views" id="views" role="tablist" aria-label="Which bookings"></div>
<div class="summary" id="summary"></div>
<div class="filters" id="filters"></div>
<p class="left-out" id="left-out" hidden></p>

<ol class="bookings" id="bookings"></ol>

<footer class="foot">
    <button class="btn" id="copy" type="button">Copy list</button>
    <button class="btn" id="csv" type="button">Download CSV</button>
    <button class="link" id="sample" type="button">Bookings look wrong? Save a setup file</button>
</footer>

<script src="popup.js"></script>
</body>
</html>
